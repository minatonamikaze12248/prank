<!DOCTYPE html>
<html>
<head>
    <title>FREE DIAMOND </title>

    <style>
        body {
            background: #111;
            color: white;
            text-align: center;
            font-family: Arial;
            padding-top: 100px;
        }

        .prank {
            max-width: 500px;
            margin: auto;
        }

        input {
            padding: 12px;
            font-size: 18px;
            margin-top: 20px;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            font-size: 18px;
        }

        .bar {
            width: 100%;
            height: 30px;
            background: #333;
            border-radius: 15px;
            overflow: hidden;
        }

        .progress {
            width: 0%;
            height: 100%;
            background: red;
        }
    </style>
</head>

<body>

    <div class="prank" id="prankBox">

        <h1>⚠️ FREE DIAMOND ⚠️</h1>

        <p>Enter your name to continue:</p>

        <input
            type="text"
            id="nameInput"
            placeholder="Enter your name"
        >

        <button onclick="startPrank()">ENTER</button>

    </div>

    <script>

        function startPrank() {

            let name = document.querySelector("#nameInput").value;

            if (name.trim() === "") {
                alert("Please enter your name!");
                return;
            }

            document.querySelector("#prankBox").innerHTML = `
                <h1>⚠️ FREE DIAMOND ⚠️</h1>

                <p>Welcome, ${name}!</p>
                <p>Checking...</p>

                <div class="bar">
                    <div class="progress" id="mainProgress"></div>
                </div>

                <p id="percent">0%</p>

                <button>❌ CANCEL</button>
            `;

            let progress = 0;

            let bar = document.querySelector("#mainProgress");
            let percent = document.querySelector("#percent");

            let timer = setInterval(function() {

                progress++;

                bar.style.width = progress + "%";
                percent.textContent = progress + "%";

                if (progress >= 100) {

                    clearInterval(timer);

                    document.querySelector("#prankBox").innerHTML = `
                        <h1>⚠️ VIRUS INSTALLATION ⚠️</h1>

                        <p id="status">Starting installation...</p>

                        <div class="bar">
                            <div class="progress" id="virusProgress"></div>
                        </div>

                        <p id="virusPercent">0%</p>
                    `;

                    let virusProgress = 0;

                    let virusTimer = setInterval(function() {

                      virusProgress++;

                    document.querySelector("#virusProgress").style.width =
                      virusProgress + "%";

                    document.querySelector("#virusPercent").textContent =
                      virusProgress + "%"; 
                       let status = document.querySelector("#status");

                        if (virusProgress < 20) {
                          status.textContent = "Scanning files...";
                        } else if (virusProgress < 40) {
                            status.textContent = "Checking system...";
                        } else if (virusProgress < 60) {
                            status.textContent = "Installing components...";
                        } else if (virusProgress < 80) {
                            status.textContent = "Processing files...";
                        } else {
                          status.textContent = "Finalizing installation...";
                        }

                        if (virusProgress >= 100) {

                            clearInterval(virusTimer);

                            document.querySelector("#prankBox").innerHTML = `
                                <h1>virus installed</h1>
                                <p>your device has been hacked by sarim 😎</p>
                            `;
                        }

                    }, 80);
                }

            }, 100);
        }

    </script>

</body>
</html>
